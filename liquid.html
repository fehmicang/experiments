<title>FICAGEB Liquid · Fehmican</title>
<style>
:root{

}
html,body{margin:0;height:100%;background:#03060b;overflow:hidden}
body{font:13px/1.35 var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
body[data-tone="light"]{--ink:#1d1d1f;--ink-soft:rgba(29,29,31,.6);--shade:rgba(255,255,255,.4);background:#eef1f6}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;transition:opacity .35s ease}
canvas.fade{opacity:0}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none;
  text-shadow:0 0 12px var(--shade);opacity:1;transition:opacity .4s ease}
body.idle .bar{opacity:0}
.title{display:grid;gap:2px}
.title b{font-weight:500;font-size:14px;letter-spacing:.01em}
.title span{color:var(--ink-soft)}
.ctl{display:flex;gap:6px;pointer-events:auto}
.ctl button,.ctl a{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--ink-soft);border-radius:999px;
  padding:5px 12px;cursor:pointer;text-decoration:none;white-space:nowrap}
.ctl button:hover,.ctl a:hover{border-color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
body.noui .bar{display:none}
.fallback{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-soft)}
@media (max-width:520px){ .title span{display:none} .ctl a{display:none} }
@media (prefers-reduced-motion:reduce){ canvas,.bar{transition:none} }
</style>
</head>

/* ================= time model ================= */
/* In loop mode every speed snaps to a whole number of turns per loop (at least one if it is not zero),
   so the last frame flows into the first. Flow runs on a circle in noise space for the same reason. */
function loopTurns(speed, L){
  const dur = totalFramesOf(L)/L.motion.fps;
  let q = Math.round(speed*dur/TAU);
  if(q === 0 && Math.abs(speed) > 1e-6) q = Math.sign(speed);
  return q;
}
function motionAngle(speed, L, frm){
  if(L.motion.loop) return loopTurns(speed, L)*TAU*frm/totalFramesOf(L);
  return speed*frm/L.motion.fps;
}
/* Smooth random hover, like a wiggle expression. Three detuned sines; in loop mode each snaps to whole turns and they stay distinct. */
/* Hover reads smooth noise along a path. Looping: the path is a closed circle whose length grows with the speed,
   so any speed loops seamlessly without snapping, and every center can wander at its own pace. */
function hover(L, i, frm, axis, speed){
  const total = totalFramesOf(L), dur = total/L.motion.fps, v = speed*0.55;
  const ox = hh2(L.seed*7 + i, axis)*200, oy = hh2(L.seed*7 + i, axis + 5)*200, oz = axis*31.7 + i*11.3;
  let n;
  if(L.motion.loop){ const rr = v*dur/TAU, th = TAU*frm/total; n = snoise3(ox + rr*Math.cos(th), oy + rr*Math.sin(th), oz); }
  else n = snoise3(ox + v*frm/L.motion.fps, oy, oz);
  return clamp(n*1.5, -1.3, 1.3);
}
/* Per-center multipliers from the variation settings: same seed, same result. */
function centerVar(L, i){
  const P = L.params, r = k => hh2(P.varSeed*131 + 17, i*7 + k)*2 - 1;
  return {sp:Math.max(0.05, 1 + P.speedVar*r(0)), hs:Math.max(0.05, 1 + P.hoverVar*r(1)*1.2), ha:Math.max(0, 1 + P.hoverAmtVar*r(2)),
    rs:Math.max(0.05, 1 + P.rotVar*r(3)*1.2)*(P.rotMix && r(4) < 0 ? -1 : 1)};
}
/* Whole-shape rotation speed of a center in rad/s: positive turns counterclockwise, negative clockwise. */
function rotSpeed(L, c, i){
  const P = L.params; return (P.rotBase + c.rot)*P.rotAll*centerVar(L, i).rs*P.timeScale;
}
/* Animated center in uv units (short side = 1) and its current size factor. */
function centerState(L, c, i, frm, W, H){
  const P = L.params, mn = Math.min(W, H), hx = 0.5*W/mn, hy = 0.5*H/mn;
  const ph = hh2(L.seed, i)*TAU + c.phase*Math.PI/180;
  const cv = centerVar(L, i);
  const dth = motionAngle(c.driftS*P.timeScale*cv.sp, L, frm) + ph*0.7;
  let ux = c.x*hx + c.driftR*Math.cos(dth), uy = c.y*hy + c.driftR*Math.sin(dth), sz = 1;

}
const hex2rgb = hx => { const n = parseInt(String(hx).slice(1), 16) || 0; return [(n >> 16 & 255)/255, (n >> 8 & 255)/255, (n & 255)/255]; };

/* ================= shader ================= */
const VERT = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p*2.0 - 1.0, 0.0, 1.0); }`;
const FRAG = `#version 300 es
precision highp float;
precision highp int;
out vec4 O;
uniform vec2 uFull, uOff;
uniform int uN, uSteps, uView, uBlend, uBgMode;
uniform vec4 uCen[8], uCS[8], uFl[8], uCol[8];
uniform vec2 uZr[8];
uniform vec2 uStretch;
uniform float uFreq, uTurb, uDetail, uDetScale, uBody, uLogMix, uMerge, uColSharp;
uniform float uPersp, uLim;
uniform int uPulseMode;
uniform int uEven;
uniform float uFov, uCamZ, uStart, uMaxStep, uReach, uDensity;
uniform vec3 uLight, uShadow;
uniform float uGain, uExposure, uSat, uContrast, uHue, uOverK;
uniform int uTone, uTransparent, uDimOn, uBgEase;
uniform float uDimAmt, uDimIn, uDimOut, uVig, uGrain, uGrainPx, uFrame;
uniform vec3 uBg1, uBg2, uBg3, uBg4;
uniform float uBgAngle, uBgScale;

float sdfC(vec3 p, int i){
  vec4 C = uCen[i];
  vec3 q = p - C.xyz;
  vec2 zr = uZr[i];
  q.xy = vec2(zr.x*q.x + zr.y*q.y, -zr.y*q.x + zr.x*q.y);
  q.xy /= uStretch;
  q /= C.w;

  q.xy = vec2(cs.z*q.x - cs.w*q.y, cs.w*q.x + cs.z*q.y);

float smin(float a, float b, float k){
  if(k <= 1e-4) return min(a, b);

float mapD(vec3 p){

float mapC(vec3 p, out vec3 col){

    float tx = uBgEase == 1 ? smoothstep(0.0, 1.0, n.x) : n.x, ty = uBgEase == 1 ? smoothstep(0.0, 1.0, n.y) : n.y;
    return mix(mix(uBg3, uBg4, tx), mix(uBg1, uBg2, tx), ty);

void main(){

  vec2 uv = (fc - 0.5*uFull)/mn;
  /* Perspective 1 is the original camera, 0 is orthographic. Wide frame correction keeps the
     perspective of a 16:9 frame and slides the camera sideways beyond it, so bodies near the left
     and right of very wide frames look the same as in the middle instead of fading out. */
  vec2 uvc = uLim > 0.0 ? clamp(uv, -uLim, uLim) : uv;
  vec3 dir = vec3(uvc*uFov*uPersp, -1.0);

    vec3 base = uShadow + gc*uGain*f;

  float g = (hash12(floor(fc/uGrainPx) + vec2(uFrame*17.0, uFrame*29.0)) - 0.5)*uGrain;
  float dith = (hash12(fc + vec2(uFrame*7.0, 3.0)) - 0.5)/255.0;

  if(uView == 1) outc = neb;
  else if(uView == 2) outc = bg;
  else if(uBlend == 0) outc = bg + neb;
  else if(uBlend == 1) outc = 1.0 - (1.0 - bg)*(1.0 - clamp(neb, 0.0, 1.0));
  else { float a = clamp(mx*uOverK, 0.0, 1.0); outc = mix(bg, mx > 1e-5 ? neb/mx : bg, a); }
  outc = outc*vig + g + dith;
  O = vec4(clamp(outc, 0.0, 1.0), 1.0);
}`;

    draw(L, frm, W, H, ox, oy, tw, th, vw = 'result', refW = W){

const totalFramesOf = L => Math.max(2, Math.round(L.motion.dur*L.motion.fps));
/* ================= showcase embed =================
   URL options:  ?look=Trio   start on a starter look
                 &cycle=14    seconds per look (0 = stay)
                 &ui=0        hide the overlay (pure background)
                 &tool=URL    where "Open the tool" points          */
const Q = new URLSearchParams(location.search);
const ORDER = ['Calm drift','Hover field','Trio','Violet core','Twin cells','Wide band','Constellation','Green signal','Soft light','Nebula'];
let lookIdx = Math.max(0, ORDER.indexOf(Q.get('look') || ''));
const CYCLE = Q.has('cycle') ? Math.max(0, +Q.get('cycle') || 0) : 14;
if(Q.get('ui') === '0') document.body.classList.add('noui');
document.getElementById('tool').href = Q.get('tool') || 'FICAGEB_Liquid_V0_5.html';

function buildLook(name){
  const st = STARTERS[name], L = DEFAULT_LOOK();
  L.params = Object.assign(L.params, st.p || {});
  L.centers = (st.c || [{}]).map(mkC);
  L.palette = [...(st.pal || DEFAULT_PALETTE)];
  L.idx = [...(st.idx || DEFAULT_IDX)];
  L.motion = {dur:20, fps:30, loop:false}; // free-running: no loop seam needed on a web page
  return normalizeLook(L);
}

const cv = document.getElementById('cv');
let G;
try{ G = makeRenderer(cv); }
catch(err){
  cv.remove(); document.querySelector('.bar').remove();
  document.body.append(Object.assign(document.createElement('p'), {className:'fallback', textContent:'This piece needs WebGL 2. Open the page in a current Chrome, Edge, Firefox or Safari.'}));
  throw err;
}

let look, t = 4, playing = true, visible = true, onScreen = true, last = performance.now(), lookT = 0;
let q = 0.6;                       // render scale, adapts to the machine
const ptr = {x:0, y:0, tx:0, ty:0};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function setLook(i, fade){
  lookIdx = (i + ORDER.length) % ORDER.length;
  const apply = () => {
    look = buildLook(ORDER[lookIdx]);
    document.getElementById('lookName').textContent = ORDER[lookIdx];
    document.body.dataset.tone = look.params.blend === 'over' ? 'light' : 'dark';
    lookT = 0; draw(); cv.classList.remove('fade');
  };
  if(fade && !reduce){ cv.classList.add('fade'); setTimeout(apply, 350); } else apply();
}

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  let w = innerWidth*dpr*q, h = innerHeight*dpr*q;
  const cap = Math.sqrt(1.6e6/(w*h)); if(cap < 1){ w *= cap; h *= cap; }
  cv.width = Math.max(2, Math.min(G.tile, Math.round(w)));
  cv.height = Math.max(2, Math.min(G.tile, Math.round(h)));
  draw();
}
addEventListener('resize', resize);

function draw(){
  if(!look) return;
  // gentle pointer parallax: nearer centers move a bit more
  const L = Object.assign({}, look, {centers:look.centers.map((c, i) => Object.assign({}, c, {x:c.x + ptr.x*0.05*(1 + 0.25*(i % 3)), y:c.y + ptr.y*0.05*(1 + 0.25*(i % 3))}))});
  G.draw(L, t*look.motion.fps, cv.width, cv.height, 0, 0, cv.width, cv.height, 'result', cv.width);
}

let fN = 0, fT = 0;
function tick(now){
  const dt = Math.min(0.1, (now - last)/1000); last = now;
  const running = playing && visible && onScreen;
  if(running){
    t += dt; lookT += dt;
    ptr.x += (ptr.tx - ptr.x)*Math.min(1, dt*3); ptr.y += (ptr.ty - ptr.y)*Math.min(1, dt*3);
    draw();
    if(CYCLE && lookT > CYCLE) setLook(lookIdx + 1, true);
    fN++; fT += dt;
    if(fT > 1.5){ const fps = fN/fT; fN = 0; fT = 0;
      if(fps < 45 && q > 0.3){ q *= 0.85; resize(); } else if(fps > 58 && q < 0.75){ q = Math.min(0.75, q*1.08); resize(); } }
  }
  requestAnimationFrame(tick);
}

const playB = document.getElementById('play');
function setPlaying(v){ playing = v; playB.textContent = v ? 'Pause' : 'Play'; }
playB.addEventListener('click', () => setPlaying(!playing));
document.getElementById('next').addEventListener('click', () => setLook(lookIdx + 1, true));
addEventListener('keydown', e => {
  if(e.code === 'Space' && e.target.tagName !== 'BUTTON'){ e.preventDefault(); setPlaying(!playing); }
  if(e.key === 'n' || e.key === 'ArrowRight') setLook(lookIdx + 1, true);
  if(e.key === 'ArrowLeft') setLook(lookIdx - 1, true);
});
addEventListener('pointermove', e => { ptr.tx = e.clientX/innerWidth*2 - 1; ptr.ty = 1 - e.clientY/innerHeight*2; wake(); });
addEventListener('pointerleave', () => { ptr.tx = ptr.ty = 0; });

// hide the overlay after a few still seconds so the piece reads cleanly
// &controls=always keeps them on; touch screens (no hover) also keep them on
const KEEP = Q.get('controls') === 'always' || matchMedia('(hover: none)').matches;
let idleT; function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT); if(!KEEP) idleT = setTimeout(() => document.body.classList.add('idle'), 4000); }
addEventListener('focusin', wake); addEventListener('pointerdown', wake); addEventListener('pointerenter', wake); wake();

// stop drawing when the tab is hidden or the embed is scrolled out of view
document.addEventListener('visibilitychange', () => { visible = !document.hidden; last = performance.now(); });
new IntersectionObserver(es => { onScreen = es[0].isIntersecting; last = performance.now(); }).observe(document.body);

setLook(lookIdx, false);
resize();
if(reduce) setPlaying(false);
requestAnimationFrame(tick);
</script>
</body>
</html>
